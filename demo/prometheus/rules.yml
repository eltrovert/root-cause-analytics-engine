groups:
  - name: rca-demo
    rules:
      - record: service:http_error_ratio:rate5m
        expr: sum by (service) (rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum by (service) (rate(http_requests_total[5m])), 1)
      - record: service:http_p95_latency_seconds:rate5m
        expr: histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[5m])))
      - alert: CheckoutPaymentDependencyDegraded
        expr: service:http_error_ratio:rate5m{service="payments"} > 0.1
        for: 30s
        labels:
          severity: warning
          service: payments
        annotations:
          summary: Payment dependency error ratio exceeds 10%
          runbook: https://example.invalid/runbooks/payments-dependency
